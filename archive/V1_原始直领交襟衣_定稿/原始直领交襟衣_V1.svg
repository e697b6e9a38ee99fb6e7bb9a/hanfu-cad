<g font-family="sans-serif" fill="#1a1a1a">
  <text x="150.0" y="96.0" font-size="52" font-weight="600">原始直领交襟衣 · ① 材料与 ② 制作（V1）</text>
  <text x="150.0" y="150.0" font-size="32" fill="#6f6f6f">4 匹拼幅 · 整块不裁肩 · 上下对折成前后 · 前中剪开 160 · 两襟各向里折 40（中间露出后片 80）· 上领条</text>
  <text x="150.0" y="200.0" font-size="30" fill="#6f6f6f">通袖 2000 ＝ 4 幅 × 500 ｜ 布片高 1248 ＝ 对折线上下各 624 ｜ 成衣衣长 624 ｜ 剪口间距 160</text>
</g>
<g font-family="sans-serif" font-size="30" fill="#1a4d8f"><text x="150.0" y="1708.0">┄ 拼幅缝（4 匹横拼）</text></g>
<g font-family="sans-serif" font-size="30" fill="#b85400"><text x="150.0" y="1754.0">┈ 上下对折线（肩线折出，不另裁前片后片）</text></g>
<g font-family="sans-serif" font-size="30" fill="#b3241c"><text x="150.0" y="1800.0">— 前中剪开线（从对折线剪到下摆，两道）</text></g>
<g font-family="sans-serif" font-size="30" fill="#1d6b3a"><text x="150.0" y="1846.0">┈ 折边线（各向里折 40，布边落在 ±40，折边即领条缝位）</text></g>
