</g>
<g font-family="sans-serif">
  <text x="150.0" y="6844.0" font-size="52" font-weight="600" fill="#1a1a1a">③ 平铺：矩领对襟 · 上衣连袖 + 下裳</text>
  <text x="150.0" y="6894.0" font-size="30" fill="#6f6f6f">袖带高 195（＝衣长）｜裳高 1677｜腰线即衣身接缝（齐胸高腰）｜前中 | 领条 40 | 后片 80（后中缝居中）| 领条 40 | 贯通到摆｜裳为正面轮廓，本体是 4 幅 × 1677</text>
</g>
