<g font-family="sans-serif" font-size="30" fill="#1a1a1a">
  <text x="150.0" y="4254.0" fill="#1a4d8f">┄ 拼幅缝（4 匹横拼，通袖 2000）</text>
  <text x="150.0" y="4298.0" fill="#6a2c91">┄ 段的分界（折过来即成腰线：衣身接缝 ＝ 齐胸高腰）</text>
  <text x="150.0" y="4342.0" fill="#b85400">┈ 对折线（中段正中；折后即肩线，衣长 195）</text>
  <text x="150.0" y="4386.0" fill="#b3241c">— 前中剪开线（两道，间距 160；从折线剪到腰线）</text>
  <text x="150.0" y="4430.0" fill="#1d6b3a">┈ 折边线（两襟各向里折 40，中间露出后片 80）</text>
  <text x="150.0" y="4474.0" fill="#1d6b3a">— 躯干衣身边缘（竖段）：自腰线往上 62，另一端即腋点（与裳无关）</text>
  <text x="150.0" y="4518.0" fill="#1d6b3a">— 袖底缝（腰线 ±430 以外到袖口，前后片缝合）：与竖段在腋点共顶点 → 不加＝敞口(侧视倒U)，加了＝闭成 0</text>
</g>
