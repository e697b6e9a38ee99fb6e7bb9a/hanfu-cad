  <text x="2590.0" y="3142.5">裳 575</text>
  <text x="520.0" y="2865.0" text-anchor="end">腰宽 740</text>
  <text x="520.0" y="3424.0" text-anchor="end">摆宽 1080</text>
  <text x="510.0" y="2800.5" font-size="24" fill="#1d6b3a" text-anchor="end">腋点 ±370 ｜ 垂线 62 ｜ 外弯 60</text>
</g>
<g font-family="sans-serif">
  <text x="150.0" y="3538.0" font-size="52" font-weight="600" fill="#1a1a1a">③ 平铺：矩领对襟 · 上衣连袖 + 下裳</text>
  <text x="150.0" y="3588.0" font-size="30" fill="#6f6f6f">袖带高 195（＝衣长）｜裳高 575｜腰线即衣身接缝（齐胸高腰）｜前中 | 领条 40 | 后片 80（后中缝居中）| 领条 40 | 贯通到摆｜裳为正面轮廓，本体是 4 幅 × 575</text>
</g>
