<svg xmlns="http://www.w3.org/2000/svg" width="3100mm" height="4125mm" viewBox="0 0 3100 4125">
<title>深衣型矩领 · 裁片与制作（V2）</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="sans-serif" fill="#1a1a1a">
  <text x="150.0" y="100.0" font-size="52" font-weight="600">深衣型矩领 · ① 材料与 ② 制作（V3 窄袖 · 衣长＝袖口 195 · 总长 770）</text>
  <text x="150.0" y="158.0" font-size="32" fill="#6f6f6f">4 匹拼幅 × 3 段 · 中段对折＝上衣（衣长 195 ＝ 袖口宽）· 上下两段折过来＝下裳（各 575 高）· 前中剪开 160、两襟各折 40 · 上领条</text>
  <text x="150.0" y="210.0" font-size="30" fill="#6f6f6f">通袖 2000 ＝ 4 幅 × 500 ｜ 总料长 1540 ＝ 中段 390 + 上段 575 + 下段 575 ｜ 腰线（衣身接缝）＝ 中段上下边 = 齐胸高腰 ｜ 腋点 ±370</text>
</g>
